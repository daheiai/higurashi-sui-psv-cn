name: 汉化问题反馈
description: 报告翻译错误、缺字、乱码、崩溃等问题
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填完整，尤其是**补丁版本**、**运行环境**和**具体现象**，否则很难定位。
  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - Vita3K 模拟器
        - PSV 实体机（rePatch）
        - 其他
    validations:
      required: true
  - type: input
    id: patch-version
    attributes:
      label: 补丁版本
      placeholder: 例如 V0.2 测试版（实体机）/ V0.1 测试版（模拟器）
    validations:
      required: true
  - type: input
    id: game-id
    attributes:
      label: 游戏编号与版本
      placeholder: 例如 PCSG00517 / V1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 主机系统 / 模拟器 / rePatch 版本
      placeholder: 例如 Vita3K 0.1.9 / PSV 3.65 + rePatch 3.0.1
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: 位置
      placeholder: 例如 鬼隐篇 / 答题小游戏 / 主菜单
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 尽量写清在哪一句、什么现象
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动游戏开始怎么操作会出现
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录像 / 崩溃日志
      description: 直接拖进来即可；若崩溃请附 ux0:data/ 下新的 psp2core-*.psp2dmp
    validations:
      required: false
